[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-automation"
version = "0.1.0"
description = "Minimal, testable YouTube Shorts rendering workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shorts = "shorts_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
